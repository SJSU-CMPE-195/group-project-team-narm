name: CI

on:
  push:
    branches: [ main, esp32-initialization ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting (clang-format)
        run: |
          # Check project sources, excluding the vendored ESP-Hosted trees
          # (which include generated protobuf code and upstream dependencies).
          if ! git ls-files -z -- '*.c' '*.h' '*.cpp' '*.hpp' \
            ':(exclude)slave/main/**' \
            ':(exclude)esp32-p4/slave/main/**' | \
            xargs -0 -r clang-format --dry-run --Werror; then
            echo "Formatting check failed. Run clang-format on your files and commit the changes."
            exit 1
          fi

  build-esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Jetson sender (ESP32-P4)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.4
          target: esp32p4
          path: esp32-p4

  sanity:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check TCP receiver stop and reconnect behavior
        run: python3 -m unittest discover -s jetson-code/tests -p test_tcp_ingest_server.py -v
      - name: Check Jetson sender button and connection control
        run: python3 esp32-p4/tests/test_jetson_stream_control.py
      - name: Check Jetson sender with a slow TCP receiver
        run: python3 esp32-p4/tests/test_jetson_buffer_backpressure.py
